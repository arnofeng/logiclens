name: Registry RC smoke test

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version to verify
        required: true
        default: 1.0.0-rc.1
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 20.19.0
          - 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org

      - name: Run registry smoke test
        run: node scripts/registry-smoke.mjs "${{ inputs.version }}"
